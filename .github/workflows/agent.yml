name: Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should the agent do?"
        required: true
        type: string
      branch:
        description: "Working branch"
        required: true
        default: "stark"
        type: string
      model:
        description: "OpenRouter model ID"
        required: true
        default: "nvidia/nemotron-3-ultra-550b-a55b:free"
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch to (or create) working branch
        run: |
          git config user.name  "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin "${{ inputs.branch }}"; then
            git checkout "${{ inputs.branch }}"
            git pull --ff-only origin "${{ inputs.branch }}" || true
          else
            git checkout -b "${{ inputs.branch }}"
            git push -u origin "${{ inputs.branch }}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Sanity check (secret visible?)
        env:
          OPENROUTER_API_KEY: ${{ secrets.STARK }}
        run: |
          node -e "console.log('key len:', (process.env.OPENROUTER_API_KEY||'').length)"

      - name: Typecheck (pre-flight)
        run: npm run typecheck || echo "::warning::typecheck failed before agent run"

      - name: Run agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.STARK }}
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
          API_DELAY_MS: "15000"
          RETRY_DELAY_MS: "60000"
          MAX_ITER: "25"
        run: npx tsx src/cli.ts run

      - name: Typecheck (post-flight)
        run: npm run typecheck || echo "::warning::typecheck failed after agent run"

      - name: Commit & push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "agent: ${{ inputs.prompt }}"
            git push origin HEAD:${{ inputs.branch }}
          fi
