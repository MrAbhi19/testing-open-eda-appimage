name: Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should the agent do?"
        required: true
        type: string
      branch:
        description: "Working branch"
        required: true
        default: "stark"
        type: string
      model:
        description: "OpenRouter model ID"
        required: true
        default: "nvidia/nemotron-3-ultra-550b-a55b:free"
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch to (or create) working branch
        run: |
          git config user.name  "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin "${{ inputs.branch }}"; then
            echo "Branch exists, checking out"
            git checkout "${{ inputs.branch }}"
            git pull --ff-only origin "${{ inputs.branch }}" || true
          else
            echo "Branch missing, creating from current HEAD"
            git checkout -b "${{ inputs.branch }}"
            git push -u origin "${{ inputs.branch }}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install

      - name: Debug 1 - is secret visible?
        env:
          CHECK: ${{ secrets.STARK }}
        run: |
          echo "len=${#CHECK}"

      - name: Debug 2 - what does node see?
        env:
          OPENROUTER_API_KEY: ${{ secrets.STARK }}
        run: |
          node -e "console.log('node sees key?', !!process.env.OPENROUTER_API_KEY, 'len:', (process.env.OPENROUTER_API_KEY||'').length)"

      - name: Run agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.STARK }}
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
          API_DELAY_MS: "30000"
          RETRY_DELAY_MS: "60000"
        run: npx tsx agent.ts

      - name: Commit & push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "agent: ${{ inputs.prompt }}"
            git push origin HEAD:${{ inputs.branch }}
          fi
