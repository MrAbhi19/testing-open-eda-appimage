name: Build Netgen AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Netgen Version Tag (e.g. 1.5.280)'
        required: true
        default: '1.5.280'
        type: string
      make_latest:
        description: 'Mark this release as GitHub "Latest"?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  NETGEN_VERSION: ${{ inputs.version }}
  APPIMAGE_NAME: "netgen-${{ inputs.version }}-x86_64.AppImage"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: 'open-eda-appimage'

      - name: Checkout Netgen upstream source
        uses: actions/checkout@v4
        with:
          repository: 'RTimothyEdwards/netgen'
          ref: ${{ env.NETGEN_VERSION }}
          path: 'netgen-src'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential m4 tcl-dev tk-dev \
            python3 wget curl file desktop-file-utils \
            python3-pil xvfb

      - name: Configure and Build Netgen
        working-directory: ./netgen-src
        run: |
          # Netgen uses standard Autotools
          ./configure --prefix=/usr
          make -j$(nproc)

      - name: Install Netgen into AppDir
        working-directory: ./netgen-src
        run: |
          # Use DESTDIR to redirect the /usr installation into our AppDir
          make DESTDIR=$GITHUB_WORKSPACE/AppDir install
          ls -la $GITHUB_WORKSPACE/AppDir/usr/bin/

      - name: Create .desktop file and 256x256 icon
        run: |
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/netgen.desktop << 'EOF'
          [Desktop Entry]
          Name=Netgen
          Exec=netgen
          Icon=netgen
          Type=Application
          Categories=Development;Electronics;
          Terminal=true
          Comment=Netgen LVS Tool
          EOF

          # Generates a distinct color for the Netgen placeholder icon
          python3 -c '
          from PIL import Image
          img = Image.new("RGBA", (256, 256), (200, 70, 50, 255))
          img.save("AppDir/usr/share/icons/hicolor/256x256/apps/netgen.png", "PNG")
          print("256x256 icon created successfully")
          '

      - name: Download linuxdeploy
        run: |
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create the AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --executable AppDir/usr/lib/netgen/tcl/netgenexec \
          --desktop-file AppDir/usr/share/applications/netgen.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/netgen.png \
          --output appimage

          if [ ! -f "${{ env.APPIMAGE_NAME }}" ]; then
            for f in *.AppImage; do
              case "$f" in
                linuxdeploy-*.AppImage) continue ;;
                *) mv "$f" "${{ env.APPIMAGE_NAME }}" ;;
              esac
            done
          fi

          ls -lh *.AppImage

      - name: Smoke test the AppImage
        run: |
          chmod +x "${{ env.APPIMAGE_NAME }}"
          # Netgen relies on Tk, which might complain if run headlessly in CI without an X server.
          # xvfb-run fakes a display server for the test. -batch prevents it from dropping into an interactive shell.
          xvfb-run ./${{ env.APPIMAGE_NAME }} -batch -help || echo "Test complete"

      - name: Compute SHA256 of the AppImage
        id: sha
        run: |
          HASH=$(sha256sum "${{ env.APPIMAGE_NAME }}" | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "SHA256: $HASH"

      - name: Write checksum file
        run: |
          sha256sum "${{ env.APPIMAGE_NAME }}" > "${{ env.APPIMAGE_NAME }}.sha256"
          cat "${{ env.APPIMAGE_NAME }}.sha256"

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netgen-v${{ env.NETGEN_VERSION }}
          name: Netgen ${{ env.NETGEN_VERSION }}
          overwrite_files: true
          body: |
            ## Netgen ${{ env.NETGEN_VERSION }} - Linux x86_64 AppImage

            A standalone, portable AppImage of **Netgen ${{ env.NETGEN_VERSION}}** built from the [official upstream repository](https://github.com/RTimothyEdwards/netgen/tree/${{ env.NETGEN_VERSION }}).

            ---

            ### Quick start

            ```
            chmod +x netgen-${{ env.NETGEN_VERSION }}-x86_64.AppImage
            ./netgen-${{ env.NETGEN_VERSION }}-x86_64.AppImage
            ```

            ### Requirements

            - Linux x86_64, glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+, etc.)

            ### Verify the download

            SHA256: `${{ steps.sha.outputs.hash }}`

            Or use the attached checksum file:
            
            ```
            sha256sum -c ${{ env.APPIMAGE_NAME}}.sha256
            ```

            ### Notes

            Built automatically by GitHub Actions. Full build logs in the **Actions** tab.

            ---

            *Netgen is developed by Tim Edwards. This is an unofficial repackaging - upstream project: https://github.com/RTimothyEdwards/netgen*
          files: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.sha256
          draft: false
          prerelease: false
          make_latest: ${{ inputs.make_latest }}
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
