name: Build Netgen AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Netgen Version (e.g. 1.5.323)'
        required: true
        default: '1.5.323'
        type: string
      make_latest:
        description: 'Mark this release as GitHub "Latest"?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  NETGEN_VERSION: ${{ inputs.version }}
  APPIMAGE_NAME: "netgen-${{ inputs.version }}-x86_64.AppImage"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake m4 libtool \
            tcl-dev tk-dev libx11-dev libxext-dev libxpm-dev libxt-dev \
            wget curl file desktop-file-utils python3-pil

      - name: Download and extract Netgen ${{ env.NETGEN_VERSION }}
        run: |
          wget -q http://opencircuitdesign.com/netgen/archive/netgen-${{ env.NETGEN_VERSION }}.tgz
          tar xzf netgen-${{ env.NETGEN_VERSION }}.tgz
          cd netgen-${{ env.NETGEN_VERSION }}
          test -f configure && echo "Source looks good"

      - name: Configure Netgen (autotools)
        run: |
          cd netgen-${{ env.NETGEN_VERSION }}
          ./configure --prefix=/usr

      - name: Build Netgen
        run: |
          cd netgen-${{ env.NETGEN_VERSION }}
          make -j$(nproc)

      - name: Install Netgen into AppDir
        run: |
          cd netgen-${{ env.NETGEN_VERSION }}
          make install DESTDIR="$PWD/../AppDir"
          # Verify both the wrapper script and the real ELF binary are present
          ls -la ../AppDir/usr/bin/netgen
          file ../AppDir/usr/lib/netgen/tcl/netgenexec

      - name: Patch netgen wrapper for AppImage relocation and batch mode
        run: |
          # The wrapper generated by ./configure hardcodes /usr/lib/netgen
          # and always passes tkcon.tcl to netgenexec. Inside the AppImage
          # the path must be $APPDIR, and tkcon.tcl pulls in Tk which fails
          # headlessly. Rewrite the wrapper so it:
          #   1. Uses $APPDIR for relocatability.
          #   2. Skips tkcon.tcl when invoked with -batch / -noconsole.
          cat > AppDir/usr/bin/netgen << 'EOF'
          #!/bin/sh
          NETGENDIR="$APPDIR/usr/lib/netgen"
          export NETGENDIR

          # Skip the Tk console in batch / no-console mode so no $DISPLAY
          # is required (CI, scripts, remote shells).
          for arg in "$@"; do
              case "$arg" in
                  -batch|-noconsole)
                      exec "$NETGENDIR/tcl/netgenexec" "$@"
                      ;;
              esac
          done

          # Interactive / GUI mode: load the Tk console as before.
          exec "$NETGENDIR/tcl/netgenexec" "$NETGENDIR/tcl/tkcon.tcl" "$@"
          EOF
          chmod +x AppDir/usr/bin/netgen

          echo "----- patched wrapper -----"
          cat AppDir/usr/bin/netgen
          echo "---------------------------"

      - name: Create .desktop file, 256x256 icon, and custom AppRun
        run: |
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/netgen.desktop << 'EOF'
          [Desktop Entry]
          Name=Netgen
          Exec=netgen
          Icon=netgen
          Type=Application
          Categories=Development;Electronics;
          Terminal=true
          Comment=Netgen LVS Tool
          EOF

          python3 -c '
          from PIL import Image
          img = Image.new("RGBA", (256, 256), (30, 100, 200, 255))
          img.save("AppDir/usr/share/icons/hicolor/256x256/apps/netgen.png", "PNG")
          print("256x256 icon created successfully")
          '

          # IMPORTANT: keep the custom AppRun OUTSIDE AppDir to avoid
          # linuxdeploy trying to copy AppDir/AppRun onto itself.
          cat > AppRun-custom << 'EOF'
          #!/bin/bash
          # Set NETGENDIR to the location of netgenexec inside the AppImage
          export NETGENDIR="$APPDIR/usr/lib/netgen"
          exec "$APPDIR/usr/bin/netgen" "$@"
          EOF
          chmod +x AppRun-custom

      - name: Download linuxdeploy
        run: |
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create the AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/lib/netgen/tcl/netgenexec \
            --desktop-file AppDir/usr/share/applications/netgen.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/netgen.png \
            --custom-apprun AppRun-custom \
            --output appimage

          if [ ! -f "${{ env.APPIMAGE_NAME }}" ]; then
            for f in *.AppImage; do
              case "$f" in
                linuxdeploy-*.AppImage) continue ;;
                *) mv "$f" "${{ env.APPIMAGE_NAME }}" ;;
              esac
            done
          fi

          ls -lh *.AppImage

      - name: Smoke test the AppImage
        run: |
          chmod +x "${{ env.APPIMAGE_NAME }}"
          # Netgen has no --version flag. Run in batch mode (no Tk / no
          # $DISPLAY needed) and pipe "quit" so the interpreter exits 0.
          echo "quit" | ./"${{ env.APPIMAGE_NAME }}" -batch
          echo "Smoke test passed"  

      - name: Compute SHA256 of the AppImage
        id: sha
        run: |
          HASH=$(sha256sum "${{ env.APPIMAGE_NAME }}" | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "SHA256: $HASH"

      - name: Write checksum file
        run: |
          sha256sum "${{ env.APPIMAGE_NAME }}" > "${{ env.APPIMAGE_NAME }}.sha256"
          cat "${{ env.APPIMAGE_NAME }}.sha256"

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netgen-v${{ env.NETGEN_VERSION }}
          name: Netgen ${{ env.NETGEN_VERSION }}
          overwrite_files: true
          body: |
            ## Netgen ${{ env.NETGEN_VERSION }} - Linux x86_64 AppImage

            A standalone, portable AppImage of **Netgen ${{ env.NETGEN_VERSION }}** built from the [official upstream source tarball](http://opencircuitdesign.com/netgen/archive/netgen-${{ env.NETGEN_VERSION }}.tgz).

            ---

            ### Quick start

            ```
            chmod +x netgen-${{ env.NETGEN_VERSION }}-x86_64.AppImage
            ./netgen-${{ env.NETGEN_VERSION }}-x86_64.AppImage
            ```

            ### Requirements

            - Linux x86_64, glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+, etc.)

            ### Verify the download

            SHA256: `${{ steps.sha.outputs.hash }}`

            Or use the attached checksum file:
            
            ```
            sha256sum -c ${{ env.APPIMAGE_NAME}}.sha256
            ```

            ### Notes

            Built automatically by GitHub Actions. Full build logs in the **Actions** tab.

            ---

            *Netgen is developed by Tim Edwards. This is an unofficial repackaging - upstream project: https://github.com/RTimothyEdwards/netgen*
          files: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.sha256
          draft: false
          prerelease: false
          make_latest: ${{ inputs.make_latest }}
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
