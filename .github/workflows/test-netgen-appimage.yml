# Full-Scale Test Workflow for Netgen AppImage
# Runs the released AppImage inside a clean Ubuntu container and performs
# a full LVS test suite against real SKY130 netlists from open source.

name: Test Netgen AppImage (Docker)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Netgen Version to test (e.g. 1.5.323)'
        required: true
        default: '1.5.323'
        type: string

permissions:
  contents: read
  actions: read

env:
  NETGEN_VERSION: ${{ inputs.version }}
  APPIMAGE_NAME: "netgen-${{ inputs.version }}-x86_64.AppImage"
  APPIMAGE_URL: "https://github.com/MrAbhi19/testing-open-eda-appimage/releases/download/netgen-v${{ inputs.version }}/netgen-${{ inputs.version }}-x86_64.AppImage"
  TEST_DIR: "netgen-test"
  # Non-interactive apt + fixed timezone (prevents tzdata prompt)
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC
  # AppImages need FUSE; containers usually don't have it.
  # This env var tells the runtime to self-extract and run instead.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  docker-test:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
      options: --user root
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Etc/UTC
        APPIMAGE_EXTRACT_AND_RUN: "1"

    # ---- THE KEY FIX: force bash inside the container ----
    # GitHub Actions defaults to `sh -e` inside containers, and dash
    # does not support `set -o pipefail`.
    defaults:
      run:
        shell: bash

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout repo (for any local test scripts you may add later)
      # ---------------------------------------------------------------
      - name: Checkout this repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Pre-seed timezone + disable debconf dialogs
      # ---------------------------------------------------------------
      - name: Configure container for non-interactive apt
        run: |
          ln -snf /usr/share/zoneinfo/"$TZ" /etc/localtime
          echo "$TZ" > /etc/timezone
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d

      # ---------------------------------------------------------------
      # 3. Runtime dependencies
      # ---------------------------------------------------------------
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget curl file ca-certificates git \
            libx11-6 libxext6 libxpm4 libxt6 \
            tcl8.6 tk8.6 \
            python3 python3-pil
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      # ---------------------------------------------------------------
      # 4. Download the AppImage from the GitHub Release
      # ---------------------------------------------------------------
      - name: Download Netgen AppImage
        run: |
          wget -q -O "$APPIMAGE_NAME" "$APPIMAGE_URL"
          ls -lh "$APPIMAGE_NAME"
          file "$APPIMAGE_NAME"
          chmod +x "$APPIMAGE_NAME"

      # ---------------------------------------------------------------
      # 5. Prepare test workspace and fetch open-source assets
      # ---------------------------------------------------------------
      - name: Prepare test workspace
        run: |
          set -uo pipefail
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          echo "::group::Clone sky130-hello-world"
          git clone --depth 1 https://github.com/sgherbst/sky130-hello-world.git
          ls -la sky130-hello-world/
          echo "::endgroup::"

          echo "::group::Clone VSD Physical Verification workshop"
          git clone --depth 1 https://github.com/glennfrey/Physical_Verification_using_Sky130.git
          ls -la Physical_Verification_using_Sky130/
          echo "::endgroup::"

          # ---- Locate sky130A_setup.tcl (local first, then URLs) ----
          SETUP_FILE="sky130A_setup.tcl"
          FOUND=0

          # Search locally inside the cloned repos
          while IFS= read -r candidate; do
            cp "$candidate" "$SETUP_FILE"
            echo "✅ Using local copy: $candidate"
            FOUND=1
            break
          done < <(find sky130-hello-world Physical_Verification_using_Sky130 \
                        -name 'sky130A_setup.tcl' 2>/dev/null)

          # Fallback to known-good raw URLs
          if [ "$FOUND" -eq 0 ]; then
            for URL in \
              "https://raw.githubusercontent.com/RTimothyEdwards/open_pdks/main/sky130/libs.tech/netgen/sky130A_setup.tcl" \
              "https://raw.githubusercontent.com/RTimothyEdwards/open_pdks/master/sky130/libs.tech/netgen/sky130A_setup.tcl" \
              "https://raw.githubusercontent.com/efabless/open_pdks/main/sky130/libs.tech/netgen/sky130A_setup.tcl" \
              ; do
              echo "Trying: $URL"
              if wget -q -L --tries=2 --timeout=20 -O "$SETUP_FILE" "$URL" \
                 && grep -qE '^\s*(proc|set)\b' "$SETUP_FILE"; then
                echo "✅ Fetched from: $URL"
                FOUND=1
                break
              fi
              rm -f "$SETUP_FILE"
            done
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️  sky130A_setup.tcl not found — SKY130 test will be skipped."
            touch SKY130_SETUP_MISSING
          fi

          echo "::group::Test workspace contents"
          ls -la
          echo "::endgroup::"

      # ---------------------------------------------------------------
      # 6. Sanity check — AppImage launches in batch mode
      # ---------------------------------------------------------------
      - name: Sanity check — AppImage runs
        run: |
          set -euo pipefail
          # -batch avoids needing a $DISPLAY. "quit" ends the interpreter.
          echo "quit" | ./"$APPIMAGE_NAME" -batch
          echo "✅ Sanity check passed."

      # ---------------------------------------------------------------
      # 7. LVS smoke test — identical netlists must match
      # ---------------------------------------------------------------
      - name: LVS smoke test — identical netlists
        run: |
          set -euo pipefail
          cd "$TEST_DIR"

          cat > netA.spice << 'EOF'
          * Simple resistor test netlist
          .subckt test a b
          R1 a b 1k
          .ends test
          EOF

          cat > netB.spice << 'EOF'
          * Simple resistor test netlist
          .subckt test a b
          R1 a b 1k
          .ends test
          EOF

          ../"$APPIMAGE_NAME" -batch lvs "netA.spice test" "netB.spice test" \
            > lvs_smoke.log 2>&1

          cat lvs_smoke.log

          grep -q "Circuits match uniquely" lvs_smoke.log \
            && echo "✅ LVS smoke test PASSED" \
            || { echo "❌ LVS smoke test FAILED"; exit 1; }

      # ---------------------------------------------------------------
      # 8. Real LVS — SKY130 inverter (layout vs. schematic)
      # ---------------------------------------------------------------
      - name: LVS test — SKY130 inverter
        run: |
          set -euo pipefail
          cd "$TEST_DIR"

          if [ -f SKY130_SETUP_MISSING ]; then
            echo "⚠️  Skipping — sky130A_setup.tcl not available."
            exit 0
          fi

          cd sky130-hello-world

          # Files in sgherbst/sky130-hello-world (flat layout):
          #   inv1.spice   -> extracted layout netlist
          #   post.spice   -> schematic-side netlist
          #   regress.sh   -> reference LVS invocation
          echo "--- available files ---"
          ls -la

          ../../"$APPIMAGE_NAME" -batch lvs \
            "inv1.spice inv1" \
            "post.spice inv1" \
            ../sky130A_setup.tcl \
            comp.out \
            > lvs_inverter.log 2>&1 || true

          cat lvs_inverter.log

          if grep -q "Circuits match uniquely" lvs_inverter.log; then
            echo "✅ SKY130 inverter LVS PASSED"
          else
            echo "❌ SKY130 inverter LVS FAILED"
            echo "--- comp.out ---"
            cat comp.out || true
            exit 1
          fi

      # ---------------------------------------------------------------
      # 9. Error handling — mismatched netlists must be detected
      # ---------------------------------------------------------------
      - name: LVS test — mismatched netlists must fail
        run: |
          set -euo pipefail
          cd "$TEST_DIR"

          cat > netMismatchA.spice << 'EOF'
          .subckt test a b
          R1 a b 1k
          .ends test
          EOF

          cat > netMismatchB.spice << 'EOF'
          .subckt test a b
          R1 a b 2k
          .ends test
          EOF

          ../"$APPIMAGE_NAME" -batch lvs \
            "netMismatchA.spice test" \
            "netMismatchB.spice test" \
            > lvs_mismatch.log 2>&1 || true

          cat lvs_mismatch.log

          if grep -q "Circuits match uniquely" lvs_mismatch.log; then
            echo "❌ Error-handling FAILED — mismatch was not detected"
            exit 1
          else
            echo "✅ Error-handling PASSED — mismatch correctly detected"
          fi

      # ---------------------------------------------------------------
      # 10. Subcircuit-level LVS
      # ---------------------------------------------------------------
      - name: LVS test — subcircuit comparison
        run: |
          set -euo pipefail
          cd "$TEST_DIR"

          cat > subA.spice << 'EOF'
          .subckt inv a b vdd vss
          M1 b a vss vss nmos
          M2 b a vdd vdd pmos
          .ends inv
          EOF

          cat > subB.spice << 'EOF'
          .subckt inv a b vdd vss
          M2 b a vdd vdd pmos
          M1 b a vss vss nmos
          .ends inv
          EOF

          ../"$APPIMAGE_NAME" -batch lvs \
            "subA.spice inv" \
            "subB.spice inv" \
            > lvs_sub.log 2>&1

          cat lvs_sub.log

          grep -q "Circuits match uniquely" lvs_sub.log \
            && echo "✅ Subcircuit LVS PASSED" \
            || { echo "❌ Subcircuit LVS FAILED"; exit 1; }

      # ---------------------------------------------------------------
      # 11. Upload all logs for inspection
      # ---------------------------------------------------------------
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netgen-test-logs-${{ env.NETGEN_VERSION }}
          path: |
            $TEST_DIR/**/*.log
            $TEST_DIR/**/*.out
          if-no-files-found: warn
