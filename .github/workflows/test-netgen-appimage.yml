# Full-Scale Test Workflow for Netgen AppImage
# Runs the built AppImage inside Docker and performs LVS tests
# against real SKY130 netlists from open-source repositories.

name: Test Netgen AppImage (Docker)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Netgen Version to test (e.g. 1.5.323)'
        required: true
        default: '1.5.323'
        type: string

permissions:
  contents: read
  actions: read

env:
  NETGEN_VERSION: ${{ inputs.version }}
  APPIMAGE_NAME: "netgen-${{ inputs.version }}-x86_64.AppImage"
  APPIMAGE_URL: "https://github.com/MrAbhi19/testing-open-eda-appimage/releases/download/netgen-v${{ inputs.version }}/netgen-${{ inputs.version }}-x86_64.AppImage"
  TEST_DIR: "netgen-test"
  # --- These two prevent the tzdata / debconf interactive hang ---
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

jobs:
  docker-test:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
      options: --user root
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Etc/UTC

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Pre-seed timezone and disable debconf dialogs BEFORE any install
      # ---------------------------------------------------------------
      - name: Configure container for non-interactive apt
        run: |
          ln -snf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" > /etc/timezone
          # Disable all debconf interactive frontends
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          # Block service start attempts (policy-rc.d) — silences invoke-rc.d warnings
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d

      # ---------------------------------------------------------------
      # Install runtime dependencies inside the container
      # ---------------------------------------------------------------
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget curl file \
            libx11-6 libxext6 libxpm4 libxt6 \
            tcl8.6 tk8.6 \
            python3 python3-pil \
            git ca-certificates
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      # ---------------------------------------------------------------
      # Download the AppImage from the GitHub Release
      # ---------------------------------------------------------------
      - name: Download Netgen AppImage
        run: |
          wget -q -O "$APPIMAGE_NAME" "$APPIMAGE_URL"
          ls -lh "$APPIMAGE_NAME"
          file "$APPIMAGE_NAME"

      # ---------------------------------------------------------------
      # 4. Prepare test directory and fetch open-source test assets
      # ---------------------------------------------------------------
      - name: Prepare test workspace
        run: |
          set -uo pipefail        # note: NOT -e, so a missing file won't kill us
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          # --- 4a. Minimal SKY130 LVS example (has its own regress.sh) ---
          git clone --depth 1 https://github.com/sgherbst/sky130-hello-world.git
          echo "--- sky130-hello-world contents ---"
          ls -la sky130-hello-world/

          # --- 4b. VSD-IAT workshop netlists ---
          git clone --depth 1 https://github.com/glennfrey/Physical_Verification_using_Sky130.git
          echo "--- Physical_Verification_using_Sky130 contents ---"
          ls -la Physical_Verification_using_Sky130/

          # --- 4c. Locate sky130A_setup.tcl ---
          # Strategy: search the repos we just cloned first, then fall back
          # to a list of known-good URLs (branch names changed over time).
          SETUP_FILE="sky130A_setup.tcl"
          FOUND=0

          # 4c-i. Look inside the cloned repos
          for candidate in \
              $(find sky130-hello-world -name 'sky130A_setup.tcl' 2>/dev/null) \
              $(find Physical_Verification_using_Sky130 -name 'sky130A_setup.tcl' 2>/dev/null) \
              ; do
            cp "$candidate" "$SETUP_FILE"
            echo "✅ Using local copy from: $candidate"
            FOUND=1
            break
          done

          # 4c-ii. Fallback to known raw URLs (tries main, master, mirrors)
          if [ "$FOUND" -eq 0 ]; then
            for URL in \
              "https://raw.githubusercontent.com/RTimothyEdwards/open_pdks/main/sky130/libs.tech/netgen/sky130A_setup.tcl" \
              "https://raw.githubusercontent.com/RTimothyEdwards/open_pdks/master/sky130/libs.tech/netgen/sky130A_setup.tcl" \
              "https://raw.githubusercontent.com/efabless/open_pdks/main/sky130/libs.tech/netgen/sky130A_setup.tcl" \
              ; do
              echo "Trying: $URL"
              if wget -q -L --tries=2 --timeout=20 -O "$SETUP_FILE" "$URL"; then
                # Sanity-check: real Tcl setup files contain "proc" or "set"
                if grep -qE '^\s*(proc|set)\b' "$SETUP_FILE"; then
                  echo "✅ Fetched sky130A_setup.tcl from: $URL"
                  FOUND=1
                  break
                else
                  echo "⚠️  Downloaded file doesn't look like a Tcl setup file"
                fi
              fi
              rm -f "$SETUP_FILE"
            done
          fi

          # 4c-iii. If we still don't have it, flag it and move on
          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️  WARNING: sky130A_setup.tcl not found anywhere."
            echo "    The SKY130 inverter LVS test will be skipped."
            touch SKY130_SETUP_MISSING
          fi

          echo "--- test workspace ---"
          ls -la

      # ---------------------------------------------------------------
      # 5. Make the AppImage executable and run basic sanity checks
      # ---------------------------------------------------------------
      - name: Sanity check – AppImage runs and prints version/banner
        run: |
          chmod +x "$APPIMAGE_NAME"

          # Netgen has no --version flag. Run in batch mode and
          # pipe "quit" so the interpreter exits cleanly.
          echo "quit" | ./"$APPIMAGE_NAME" -batch

          # Verify the binary is a valid ELF inside the AppImage
          ./"$APPIMAGE_NAME" --appimage-extract-and-run -batch <<< "quit" || true

          echo "Sanity check passed."

      # ---------------------------------------------------------------
      # 6. LVS Smoke Test – compare two identical netlists (self-check)
      # ---------------------------------------------------------------
      - name: LVS smoke test – identical netlists must match
        run: |
          cd "$TEST_DIR"

          # Create two identical minimal SPICE netlists (a simple resistor).
          cat > netA.spice << 'EOF'
          * Simple resistor test netlist
          .subckt test a b
          R1 a b 1k
          .ends test
          EOF

          cat > netB.spice << 'EOF'
          * Simple resistor test netlist
          .subckt test a b
          R1 a b 1k
          .ends test
          EOF

          # Run LVS in batch mode. Netgen should report a match.
          ../"$APPIMAGE_NAME" -batch lvs "netA.spice test" "netB.spice test" \
            > lvs_smoke.log 2>&1

          cat lvs_smoke.log

          # Check for the success indicator in the log.
          if grep -q "Circuits match uniquely" lvs_smoke.log; then
            echo "✅ LVS smoke test PASSED"
          else
            echo "❌ LVS smoke test FAILED"
            exit 1
          fi

      # ---------------------------------------------------------------
      # 7. Real LVS Test – SKY130 inverter (layout vs. schematic)
      # ---------------------------------------------------------------
      - name: LVS test – SKY130 inverter from sky130-hello-world
        run: |
          cd "$TEST_DIR/sky130-hello-world"

          # The repo contains extracted layout netlist and schematic netlist.
          # We use the provided regression script as a reference.
          ls -la

          # Run netgen LVS comparing the extracted layout SPICE to the
          # schematic SPICE, using the SKY130 setup file.
          ../../"$APPIMAGE_NAME" -batch lvs \
            "layout/inv1.spice inv1" \
            "schematic/inv1.spice inv1" \
            ../sky130A_setup.tcl \
            comp.out \
            > lvs_inverter.log 2>&1

          cat lvs_inverter.log

          if grep -q "Circuits match uniquely" lvs_inverter.log; then
            echo "✅ SKY130 inverter LVS PASSED"
          else
            echo "❌ SKY130 inverter LVS FAILED"
            echo "--- comp.out ---"
            cat comp.out || true
            exit 1
          fi

      # ---------------------------------------------------------------
      # 8. Error-Handling Test – Mismatched netlists must be detected
      # ---------------------------------------------------------------
      - name: LVS test – mismatched netlists must fail
        run: |
          cd "$TEST_DIR"

          cat > netMismatchA.spice << 'EOF'
          .subckt test a b
          R1 a b 1k
          .ends test
          EOF

          cat > netMismatchB.spice << 'EOF'
          .subckt test a b
          R1 a b 2k
          .ends test
          EOF

          ../"$APPIMAGE_NAME" -batch lvs \
            "netMismatchA.spice test" \
            "netMismatchB.spice test" \
            > lvs_mismatch.log 2>&1 || true

          cat lvs_mismatch.log

          # Netgen should NOT report a match for mismatched values.
          if grep -q "Circuits match uniquely" lvs_mismatch.log; then
            echo "❌ Error-handling test FAILED – mismatch was not detected"
            exit 1
          else
            echo "✅ Error-handling test PASSED – mismatch correctly detected"
          fi

      # ---------------------------------------------------------------
      # 9. Subcircuit LVS Test – compare a specific subcircuit
      # ---------------------------------------------------------------
      - name: LVS test – subcircuit-level comparison
        run: |
          cd "$TEST_DIR"

          cat > subA.spice << 'EOF'
          .subckt inv a b vdd vss
          M1 b a vss vss nmos
          M2 b a vdd vdd pmos
          .ends inv
          EOF

          cat > subB.spice << 'EOF'
          .subckt inv a b vdd vss
          M2 b a vdd vdd pmos
          M1 b a vss vss nmos
          .ends inv
          EOF

          ../"$APPIMAGE_NAME" -batch lvs \
            "subA.spice inv" \
            "subB.spice inv" \
            > lvs_sub.log 2>&1

          cat lvs_sub.log

          if grep -q "Circuits match uniquely" lvs_sub.log; then
            echo "✅ Subcircuit LVS PASSED"
          else
            echo "❌ Subcircuit LVS FAILED"
            exit 1
          fi

      # ---------------------------------------------------------------
      # 10. Upload test logs for inspection
      # ---------------------------------------------------------------
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netgen-test-logs-${{ env.NETGEN_VERSION }}
          path: |
            $TEST_DIR/*.log
            $TEST_DIR/*.out
            $TEST_DIR/sky130-hello-world/*.log
            $TEST_DIR/sky130-hello-world/comp.out
          if-no-files-found: warn
