name: Build sv2v AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sv2v Version (e.g. 0.0.12, 0.0.11)'
        required: true
        default: '0.0.12'
        type: string
      make_latest:
        description: 'Mark this release as GitHub "Latest"?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  SV2V_VERSION: ${{ inputs.version }}
  APPIMAGE_NAME: "sv2v-${{ inputs.version }}-x86_64.AppImage"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # ubuntu-22.04 runners already have 'stack' pre-installed for Haskell.
          # We just need standard C utilities and GMP for compiling the bindings.
          sudo apt-get install -y \
            make git wget curl desktop-file-utils \
            libgmp-dev zlib1g-dev python3-pil

      - name: Download and extract sv2v ${{ env.SV2V_VERSION }}
        run: |
          wget -q https://github.com/zachjs/sv2v/archive/refs/tags/v${{ env.SV2V_VERSION }}.tar.gz
          tar xf v${{ env.SV2V_VERSION }}.tar.gz
          test -f sv2v-${{ env.SV2V_VERSION }}/Makefile && echo "Source looks good"

      - name: Build sv2v
        working-directory: sv2v-${{ env.SV2V_VERSION }}
        run: |
          # Upstream makefile handles calling 'stack' and outputs to ./bin/sv2v
          make -j$(nproc)

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp sv2v-${{ env.SV2V_VERSION }}/bin/sv2v AppDir/usr/bin/sv2v
          strip AppDir/usr/bin/sv2v
          ls -la AppDir/usr/bin/

      - name: Create .desktop file and 256x256 icon
        run: |
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/sv2v.desktop << 'EOF'
          [Desktop Entry]
          Name=sv2v
          Exec=sv2v
          Icon=sv2v
          Type=Application
          Categories=Development;Electronics;
          Terminal=true
          Comment=SystemVerilog to Verilog Converter
          EOF

          python3 -c '
          from PIL import Image
          # A green-themed placeholder icon to differentiate from Yosys
          img = Image.new("RGBA", (256, 256), (40, 180, 100, 255))
          img.save("AppDir/usr/share/icons/hicolor/256x256/apps/sv2v.png", "PNG")
          print("256x256 icon created successfully")
          '

      - name: Download linuxdeploy
        run: |
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create the AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/sv2v \
            --desktop-file AppDir/usr/share/applications/sv2v.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/sv2v.png \
            --output appimage

          if [ ! -f "${{ env.APPIMAGE_NAME }}" ]; then
            for f in *.AppImage; do
              case "$f" in
                linuxdeploy-*.AppImage) continue ;;
                *) mv "$f" "${{ env.APPIMAGE_NAME }}" ;;
              esac
            done
          fi

          ls -lh *.AppImage

      - name: Smoke test the AppImage
        run: |
          chmod +x "${{ env.APPIMAGE_NAME }}"
          ./"${{ env.APPIMAGE_NAME }}" --help

      - name: Compute SHA256 of the AppImage
        id: sha
        run: |
          HASH=$(sha256sum "${{ env.APPIMAGE_NAME }}" | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "SHA256: $HASH"

      - name: Write checksum file
        run: |
          sha256sum "${{ env.APPIMAGE_NAME }}" > "${{ env.APPIMAGE_NAME }}.sha256"
          cat "${{ env.APPIMAGE_NAME }}.sha256"

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sv2v-v${{ env.SV2V_VERSION }}
          name: sv2v ${{ env.SV2V_VERSION }}
          overwrite_files: true
          body: |
            ## sv2v ${{ env.SV2V_VERSION }} - Linux x86_64 AppImage

            A standalone, portable AppImage of **sv2v ${{ env.SV2V_VERSION }}** built from the [official upstream source tarball](https://github.com/zachjs/sv2v/releases/tag/v${{ env.SV2V_VERSION }}).

            ---

            ### Quick start

            ```bash
            chmod +x sv2v-${{ env.SV2V_VERSION }}-x86_64.AppImage
            ./sv2v-${{ env.SV2V_VERSION }}-x86_64.AppImage --help
            ```

            ### Requirements

            - Linux x86_64, glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+, etc.)

            ### Verify the download

            SHA256: `${{ steps.sha.outputs.hash }}`

            Or use the attached checksum file:
            
            ```bash
            sha256sum -c ${{ env.APPIMAGE_NAME }}.sha256
            ```

            ### Notes

            Built automatically by GitHub Actions. Full build logs in the **Actions** tab.

            ---

            *sv2v is developed by Zachary Snow (zachjs) and contributors. This is an unofficial repackaging - upstream project: https://github.com/zachjs/sv2v*
          files: |
            ${{ env.APPIMAGE_NAME }}
            ${{ env.APPIMAGE_NAME }}.sha256
          draft: false
          prerelease: false
          make_latest: ${{ inputs.make_latest }}
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
